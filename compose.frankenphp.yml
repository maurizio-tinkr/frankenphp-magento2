# Runtime: FrankenPHP (classic or worker mode, FRANKENPHP_MODE in .env)
services:
  app:
    image: frankenphp-magento2/frankenphp:${FRANKENPHP_VERSION}-php${PHP_VERSION}
    build:
      context: .
      dockerfile: frankenphp/Dockerfile
      args: [FRANKENPHP_VERSION, PHP_VERSION, COMPOSER_VERSION]
    environment:
      PHP_WORKERS: ${PHP_WORKERS}
      FRANKENPHP_MODE: ${FRANKENPHP_MODE}
      WORKER_MAX_REQUESTS: ${WORKER_MAX_REQUESTS}
    volumes:
      - magento:/var/www/html
    ports:
      - "127.0.0.1:${WEB_PORT:-${HTTP_PORT}}:80"
    deploy:
      resources:
        limits: { cpus: "${APP_CPUS}", memory: "${APP_MEMORY}" }
    depends_on:
      db: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      valkey: { condition: service_healthy }
    networks:
      magento:
        aliases: [backend]

  # One-shot installer: docker compose run --rm install
  install:
    extends: app
    profiles: [install]
    ports: !reset []
    deploy: !reset {}
    networks: !override [magento]
    entrypoint: ["bash", "/install/install.sh"]
    command: []
    environment:
      MAGENTO_DISTRIBUTION: ${MAGENTO_DISTRIBUTION}
      MAGENTO_VERSION: ${MAGENTO_VERSION}
      MAGENTO_COMPOSER_PUBLIC_KEY: ${MAGENTO_COMPOSER_PUBLIC_KEY}
      MAGENTO_COMPOSER_PRIVATE_KEY: ${MAGENTO_COMPOSER_PRIVATE_KEY}
      SAMPLE_DATA: ${SAMPLE_DATA}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      HTTP_PORT: ${HTTP_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
      COMPOSER_CACHE_DIR: /composer-cache
    volumes:
      - ./install:/install:ro
      - composer:/composer-cache
    depends_on:
      db: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      valkey: { condition: service_healthy }
