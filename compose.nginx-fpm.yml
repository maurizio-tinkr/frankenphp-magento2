# Runtime: nginx + php-fpm
services:
  app:
    image: frankenphp-magento2/php-fpm:${PHP_VERSION}
    build:
      context: .
      dockerfile: nginx-fpm/php.Dockerfile
      args: [PHP_VERSION, COMPOSER_VERSION]
    environment:
      PHP_WORKERS: ${PHP_WORKERS}
    volumes:
      - magento:/var/www/html
    deploy:
      resources:
        limits: { cpus: "${APP_CPUS}", memory: "${APP_MEMORY}" }
    depends_on:
      db: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      valkey: { condition: service_healthy }
    networks: [magento]

  # One-shot installer: docker compose run --rm install
  install:
    extends: app
    profiles: [install]
    ports: !reset []
    deploy: !reset {}
    entrypoint: ["bash", "/install/install.sh"]
    command: []
    environment:
      MAGENTO_DISTRIBUTION: ${MAGENTO_DISTRIBUTION}
      MAGENTO_VERSION: ${MAGENTO_VERSION}
      MAGENTO_COMPOSER_PUBLIC_KEY: ${MAGENTO_COMPOSER_PUBLIC_KEY}
      MAGENTO_COMPOSER_PRIVATE_KEY: ${MAGENTO_COMPOSER_PRIVATE_KEY}
      SAMPLE_DATA: ${SAMPLE_DATA}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      HTTP_PORT: ${HTTP_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
      COMPOSER_CACHE_DIR: /composer-cache
    volumes:
      - ./install:/install:ro
      - composer:/composer-cache
    depends_on:
      db: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      valkey: { condition: service_healthy }

  web:
    image: nginx:${NGINX_VERSION}
    volumes:
      - magento:/var/www/html:ro
      - ./nginx-fpm/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-fpm/magento.conf:/etc/nginx/magento.conf:ro
    ports:
      - "127.0.0.1:${HTTP_PORT}:80"
    # nginx gets its own CPU on top of APP_CPUS (FrankenPHP's web server shares APP_CPUS with PHP).
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }
    depends_on: [app]
    networks: [magento]
