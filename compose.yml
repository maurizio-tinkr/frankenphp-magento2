name: ${COMPOSE_PROJECT_NAME:-frankenphp-magento2}

x-db-env: &db-env
  MYSQL_DATABASE: ${DB_NAME}
  MYSQL_USER: ${DB_USER}
  MYSQL_PASSWORD: ${DB_PASSWORD}
  MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

services:
  db:
    image: ${DB_ENGINE}:${DB_VERSION}
    environment: *db-env
    volumes:
      - db-${DB_ENGINE}:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/conf.d/zz-magento.cnf:ro
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    healthcheck:
      # MariaDB ships healthcheck.sh, MySQL ships mysqladmin.
      test: ["CMD-SHELL", "if command -v healthcheck.sh >/dev/null; then healthcheck.sh --connect --innodb_initialized; else mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent; fi"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [magento]

  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION}
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP} -Xmx${OPENSEARCH_HEAP}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 5s
      timeout: 10s
      retries: 60
    networks: [magento]

  valkey:
    image: valkey/valkey:${VALKEY_VERSION}
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [magento]

  # --- Optional extras (COMPOSE_PROFILES in .env) ---------------------------

  rabbitmq:
    profiles: [rabbitmq]
    image: rabbitmq:${RABBITMQ_VERSION}-management
    environment:
      RABBITMQ_DEFAULT_USER: magento
      RABBITMQ_DEFAULT_PASS: magento
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks: [magento]

  mailpit:
    profiles: [mailpit]
    image: axllent/mailpit:${MAILPIT_VERSION}
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"
    networks: [magento]

  opensearch-dashboards:
    profiles: [opensearch-dashboards]
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION}
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:${OPENSEARCH_DASHBOARDS_PORT}:5601"
    depends_on:
      opensearch: { condition: service_healthy }
    networks: [magento]

  # Varnish takes HTTP_PORT; set WEB_PORT in .env so the runtime moves out of its way.
  varnish:
    profiles: [varnish]
    image: varnish:${VARNISH_VERSION}
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    environment:
      VARNISH_SIZE: 512M
    # Varnish resolves "backend" once, at start: restart it whenever the runtime is recreated,
    # and retry until the name exists (nginx's web container starts after app).
    restart: on-failure
    depends_on:
      app: { condition: service_started, restart: true }
    ports:
      - "127.0.0.1:${HTTP_PORT}:80"
    networks: [magento]

  # Benchmark: docker compose --profile bench run --rm k6 run ... /bench/storefront.js (see README)
  k6:
    profiles: [bench]
    image: grafana/k6:${K6_VERSION}
    user: root   # writes results into ./bench/results
    environment:
      HOST: localhost:${HTTP_PORT}
    volumes:
      - ./bench:/bench
    networks: [magento]

networks:
  magento:

volumes:
  magento:
  composer:
  opensearch:
  # One data volume per engine: switching DB_ENGINE never hands MySQL a MariaDB datadir.
  db-mariadb:
  db-mysql:
